            background: white;
            box-shadow: 0 10px 40px rgba(255, 105, 180, 0.25);

            padding: 5px 20px;
            border-radius: 25px;
            display: inline-block;

            margin: 15px 0;
            letter-spacing: 1px;
        }

        .variacao {

            padding: 8px 25px;

            text-shadow: 3px 3px 0px #ffd1e8;

            padding: 10px 40px;
            border-radius: 25px;
            background: linear-gradient(to bottom, #fff, #fff5f9);

        .contador {

            bottom: 20px;
            right: 20px;
            font-size: 1em;
            color: #999;
            border: 2px solid #ffb6d9;
            padding: 8px 15px;

            bottom: 20px;
            left: 20px;
            font-size: 1em;
            color: #ff69b4;

        @keyframes pulse {

            }
            50% {

        }
