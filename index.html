        }

            text-align: center;

        }

        .slide-box {

            border-radius: 30px;
            padding: 30px 30px;

            box-shadow: 0 10px 40px rgba(255, 105, 180, 0.3);

            gap: 25px;
            min-height: 100px;

        .variacao {

            border: 3px solid #ffb6d9;
            padding: 5px 18px;
            border-radius: 25px;
            background: #fff5f9;
            font-weight: bold;
        }

        .valor {
            font-size: 3.5em;
            font-weight: bolder;
            color: #ff1493;
            text-shadow: 2px 2px 0px #ffd1e8;
            border: 3px dashed #ff69b4;
            padding: 5px 25px;
            border-radius: 20px;
            background: linear-gradient(to bottom, #fff, #fff5f9);
        }

        .separador {
            color: #ff69b4;
            font-size: 2.5em;
            font-weight: bold;
        }

        .contador {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 1em;
            color: #999;
            border: 2px solid #ffb6d9;
            padding: 8px 15px;
            border-radius: 20px;
        }

        @keyframes pulse {
            0%, 100% {

            }
            50% { 
                box-shadow: 0 15px 60px rgba(255, 105, 180, 0.6); 
            }
        }

        .slide-box {
            animation: pulse 2s infinite;
        }
