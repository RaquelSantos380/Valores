    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            width: 95%;
            max-width: 1000px;
            position: relative;
        }

        .slide-wrapper {
            position: relative;
            min-height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slide-box {
            border: 6px solid #ff69b4;
            border-radius: 30px;
            padding: 30px 30px;
            background: white;
            box-shadow: 0 10px 40px rgba(255, 105, 180, 0.3);
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 25px;
            position: absolute;
            width: 100%;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .slide-box.ativo {
            opacity: 1;
            transform: translateY(0);
            position: relative;
        }

        .pet-nome {
            font-size: 3.2em;
            font-weight: bold;
            color: #1a1a1a;
            letter-spacing: 1px;
        }

        .variacao {
            font-size: 2.2em;
            color: #d63384;
            border: 3px solid #ffb6d9;
            padding: 5px 18px;
            border-radius: 25px;
            background: #fff5f9;
            font-weight: bold;
        }

        .valor {
            font-size: 3.5em;
            font-weight: bolder;
            color: #ff1493;
            text-shadow: 2px 2px 0px #ffd1e8;
            border: 3px dashed #ff69b4;
            padding: 5px 25px;
            border-radius: 20px;
            background: linear-gradient(to bottom, #fff, #fff5f9);
        }

        .contador {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 1em;
            color: #999;
            border: 2px solid #ffb6d9;
            padding: 8px 15px;
            border-radius: 20px;
        }

        @keyframes pulse {
            0%, 100% { 
                box-shadow: 0 10px 40px rgba(255, 105, 180, 0.3); 
            }
            50% { 
                box-shadow: 0 15px 60px rgba(255, 105, 180, 0.6); 
            }
        }

        .slide-box.ativo {
            animation: pulse 2s infinite;
        }
    </style>
</head>

            slides[index].classList.add('ativo');
            contadorEl.textContent = `${index + 1} / ${totalSlides}`;
